[pytest]
testpaths = tests
pythonpath = .
python_files = test_*.py
python_classes = Test*
python_functions = test_*

addopts = 
    -ra
    -v
    --strict-markers
    --tb=short
    --maxfail=5
    --disable-warnings
    --html=reports/html/report.html
    --self-contained-html
    --cov=src
    --cov-report=term-missing
    --cov-report=html:reports/coverage

markers =
    unit: 单元测试
    integration: 集成测试
    api: API测试
    slow: 慢速测试
    fast: 快速测试
    smoke: 冒烟测试

timeout = 300
timeout_method = thread

log_cli = true
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)s] %(message)s
log_cli_date_format = %Y-%m-%d %H:%M:%S
